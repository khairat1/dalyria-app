name: dalyria
description: "Dalyria (دليريا) - discover verified, up-to-date food places in Damascus."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Version number is three numbers separated by dots, then a build number after +.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Backend (Supabase) and Google sign-in
  supabase_flutter: ^2.17.1
  google_sign_in: ^7.2.0

  # Maps
  google_maps_flutter: ^2.17.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
